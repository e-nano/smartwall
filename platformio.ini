[platformio]
default_envs = smartbin_integrated_rev02

[env:elegoo_esp32]
platform = espressif32@^6.10.0
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/release/build_metadata.py
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = default.csv
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINOJSON_ENABLE_COMMENTS=0
  -DSMARTWALL_BOARD_DEVKIT=1
lib_deps =
  bogde/HX711@^0.7.5
  adafruit/Adafruit NeoPixel@^1.12.3
  bblanchon/ArduinoJson@^7.3.0
  knolleary/PubSubClient@^2.8
  zinggjm/GxEPD2@^1.6.4

[env:smartbin_integrated_rev02]
platform = espressif32@^6.10.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/release/build_metadata.py
monitor_speed = 115200
upload_speed = 115200
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINOJSON_ENABLE_COMMENTS=0
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSMARTWALL_BOARD_INTEGRATED_REV02=1
lib_deps =
  bogde/HX711@^0.7.5
  adafruit/Adafruit NeoPixel@^1.12.3
  bblanchon/ArduinoJson@^7.3.0
  knolleary/PubSubClient@^2.8
  zinggjm/GxEPD2@^1.6.4
